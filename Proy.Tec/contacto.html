<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Sensi Kids</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
 
    <header class="encabezado">
        <div class="contenedor">
            <a class="logo" href="index.html">Sensi Kids</a>
            <nav class="menu">
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>
 
    <main class="contenedor pagina">
        <h1>Contacto</h1>
        <p class="bajada">Dejanos tu consulta y nos pondremos en contacto.</p>
 
        <div class="contacto-contenido">
            <section class="datos-contacto">
                <h2>Datos de la tienda</h2>
                <p><strong>Correo:</strong> sensikids459@gmail.com</p>
                <p><strong>Instagram:</strong> sensi_kidss</p>
                <p><strong>Ubicación:</strong> General Roca, Río Negro</p>
            </section>
 
            <form class="formulario">
                <label for="nombre">Nombre y apellido</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribí tu nombre" required>
 
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com" required>
 
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5"
                          placeholder="Escribí tu consulta" required></textarea>
 
                <button class="boton" type="submit">Enviar consulta</button>
            </form>
        </div>
    </main>
 
    <footer class="pie">
        <p>© 2026 Sensi Kids - Todos los derechos reservados.</p>
    </footer>
 
</body>
